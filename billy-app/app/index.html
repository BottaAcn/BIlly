<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Billy — dev</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  fieldset { margin-bottom: 24px; }
  textarea, input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  textarea { height: 80px; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
  button { padding: 8px 16px; margin-right: 8px; }
  li { margin-bottom: 6px; }
</style>
</head>
<body>
  <h1>Billy — dev</h1>
  <p>UI di test, non definitiva. Fase 2: ogni asset caricato/modificato passa da una coda di revisione prima di diventare visibile/citabile da Billy.</p>

  <fieldset>
    <legend>1. Carica asset</legend>
    <input id="docTitle" placeholder="Titolo">
    <textarea id="docContent" placeholder="Contenuto (testo incollato) — oppure scegli un file sotto"></textarea>
    <input id="docFile" type="file" accept=".pdf,.docx,.txt">
    <button onclick="uploadAsset()">Carica (va in revisione)</button>
    <pre id="addResult"></pre>
  </fieldset>

  <fieldset>
    <legend>2. Coda di revisione</legend>
    <button onclick="loadQueue()">Aggiorna coda</button>
    <ul id="queueList"></ul>
  </fieldset>

  <fieldset>
    <legend>3. Chiedi a Billy</legend>
    <input id="question" placeholder="Fai una domanda sui documenti approvati">
    <button onclick="askBilly()">Chiedi</button>
    <pre id="askResult"></pre>
  </fieldset>

<script>
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // strip data:...;base64,
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadAsset() {
  const title = document.getElementById('docTitle').value;
  const content = document.getElementById('docContent').value;
  const fileInput = document.getElementById('docFile');
  const file = fileInput.files[0];
  const out = document.getElementById('addResult');
  out.textContent = 'Attendere...';
  try {
    const body = { title, description: '', type: 'document', content, externalLink: '' };
    if (file) {
      body.fileContent = await readFileAsBase64(file);
      body.fileName = file.name;
      body.fileMimeType = file.type;
    }
    const res = await fetch('/rest/catalog/uploadAsset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    out.textContent = JSON.stringify(await res.json(), null, 2);
    loadQueue();
  } catch (e) {
    out.textContent = 'Errore: ' + e.message;
  }
}

async function loadQueue() {
  const list = document.getElementById('queueList');
  list.innerHTML = 'Attendere...';
  try {
    const res = await fetch('/rest/catalog/listReviewQueue');
    const items = await res.json();
    list.innerHTML = (items || []).map(i => `
      <li>
        [${i.kind}] <b>${i.title}</b> (${i.type || '-'})
        — inviato da ${i.submittedBy || '-'}
        <button onclick="approve('${i.revisionId}')">Approva</button>
      </li>
    `).join('') || '<li>(coda vuota)</li>';
  } catch (e) {
    list.innerHTML = 'Errore: ' + e.message;
  }
}

async function approve(revisionId) {
  await fetch('/rest/catalog/reviewRevision', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ revisionId, approve: true, validityMonths: 12, pointsPct: 100 })
  });
  loadQueue();
}

async function askBilly() {
  const question = document.getElementById('question').value;
  const out = document.getElementById('askResult');
  out.textContent = 'Attendere...';
  try {
    const res = await fetch('/rest/billy/askBilly', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    const sourcesHtml = (data.sources || [])
      .map(s => `<li><a href="${s.link}">${s.title}</a> — [${s.certificationLevel}] similarity ${s.similarity.toFixed(3)}</li>`)
      .join('');
    out.innerHTML = `<p>${data.answer ? data.answer.replace(/\n/g, '<br>') : ''}</p><ul>${sourcesHtml}</ul>`;
  } catch (e) {
    out.textContent = 'Errore: ' + e.message;
  }
}

loadQueue();
</script>
</body>
</html>
