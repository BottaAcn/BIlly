_schema-version: "3.3"
ID: billy-app
version: 1.0.0

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
        - node scripts/copy-app.js
        - node scripts/zip-html5-content.js

modules:
  - name: billy-srv
    type: nodejs
    path: ./gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256MB
      disk-quota: 1024MB
    build-parameters:
      builder: npm
      ignore: ["node_modules/"]
    requires:
      - name: billy-hdi-container
      - name: billy-application-logs
    # Fase 6 — pubblica il proprio URL per la risorsa billy-destination
    # (sotto). Nessuna nuova dipendenza né comportamento diverso: billy-srv
    # resta raggiungibile direttamente come prima, in parallelo all'approuter.
    provides:
      - name: billy-srv-props
        properties:
          srv-url: ${default-url}

  # Fase 6 — approuter: punto d'ingresso unico per il frontend, servito da
  # HTML5 App Repo invece che direttamente da CAP. authenticationMethod:
  # "none" nel suo xs-app.json — nessun login reale finché XSUAA (Fase 8)
  # non verrà attivata sulla stessa infrastruttura.
  - name: billy-approuter
    type: approuter.nodejs
    path: ./router
    parameters:
      buildpack: nodejs_buildpack
      memory: 128MB
      disk-quota: 256MB
    build-parameters:
      builder: npm
      ignore: ["node_modules/"]
    requires:
      - name: billy-destination
      - name: billy-html5-repo-runtime

  # Fase 6 — carica il contenuto del frontend (app/index.html, js/,
  # styles/) dentro billy-html5-repo-host. html5-apps-repo richiede uno zip
  # esterno che contenga uno zip interno per app (verificato con un deploy
  # reale — il tentativo con un modulo `type: html5` + build-parameters.
  # requires di mbt produceva file grezzi, non annidati, e veniva rifiutato:
  # "must include a zip file that contains a zip file for each HTML5
  # application", vedi fase6-checklist.md §1.6). Lo zip interno
  # (billy-ui.zip) è prodotto da scripts/zip-html5-content.js in before-all;
  # mbt impacchetta poi normalmente questa cartella come proprio pacchetto,
  # ottenendo lo zip esterno che lo contiene — struttura corretta.
  - name: billy-html5-app-deployer
    type: com.sap.application.content
    path: ./html5-content
    requires:
      - name: billy-html5-repo-host
        parameters:
          content-target: true

  - name: billy-db-deployer
    type: hdb
    path: ./gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256MB
      disk-quota: 1024MB
    build-parameters:
      ignore: ["node_modules/"]
    requires:
      - name: billy-hdi-container

resources:
  # ------------------------------------------------------------
  # XSUAA — struttura pronta ma NON referenziata da nessun modulo.
  # Per attivarla in futuro: (1) scommentare questa risorsa,
  # (2) aggiungere "requires: [{name: billy-uaa}]" al modulo billy-srv,
  # (3) scommentare @(requires:...) in srv/billy-service.cds.
  # - name: billy-uaa
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: xsuaa
  #     service-plan: application
  #     path: ./xs-security.json
  #     config:
  #       xsappname: billy-uaa
  # ------------------------------------------------------------
  - name: billy-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service-name: billy-hdi-container
    properties:
      com-container-name: "${service-name}"

  # Fase 10 — logging persistente/ricercabile. Il servizio raccomandato in
  # architecture.md §11 (cloud-logging) non è entitled in questo subaccount
  # (verificato con `cf marketplace`) — application-logs (lite) è il ponte
  # disponibile subito, stesso pattern già usato per lo scanning malware in
  # Fase 5. @sap/cds rileva da solo questo binding (lib/log/format/aspects/
  # als.js), nessuna modifica applicativa necessaria.
  - name: billy-application-logs
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite

  # Fase 6 — destination consultata dall'app (app/xs-app.json) per
  # raggiungere billy-srv tramite l'approuter, invece di un URL scritto a
  # mano. NoAuthentication coerente con authenticationMethod: none (Fase 6,
  # nessuna auth reale finché XSUAA non si attiva in Fase 8).
  - name: billy-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: billy-srv-props
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: billy-srv-api
                Description: Billy backend (REST + MCP)
                URL: ~{billy-srv-props/srv-url}
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.Timeout: 300000

  # Fase 6 — dove billy-html5-app-deployer carica il contenuto di billy-ui.
  - name: billy-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # Fase 6 — da dove l'approuter serve il contenuto di billy-ui a runtime.
  - name: billy-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
